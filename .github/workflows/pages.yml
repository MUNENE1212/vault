# Static-site deploy to GitHub Pages (for ementech-portfolio/portfolio etc.)
# No build step — publishes index.html + assets/ as-is.

name: Deploy static site to GitHub Pages

# The vault is a private, internal index. It is no longer published on every
# push; run this manually only if you deliberately want a (private) Pages copy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4