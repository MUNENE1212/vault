# GitHub Pages for the vault: publishes ONLY a redirect stub, never the catalogue.

name: Deploy static site to GitHub Pages

# The vault is a private, internal index and must never be published.
# Pages serves only a redirect stub (pages-stub/) to the public
# portfolio, replacing an older deployment that exposed internal notes.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages-stub'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4